name: Deploy

# Publishes the site on GitHub Pages (https://quenti77.github.io/qlang-learn/) when main changes.
on:
  push:
    branches: [main]
  # qlang's workflow `next` sends this when main changes: the version "next" is rebuilt
  repository_dispatch:
    types: [qlang-next]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags `site-X.Y` give the text of the archived versions (git archive)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the archived versions are built once: this folder keeps them between two runs (their key is in the folder name)
      - uses: actions/cache@v4
        with:
          path: .cache/versions
          key: versions-${{ github.sha }}
          restore-keys: versions-
      # one site per version of versions.json (each with its own sync, checks, build and search index)
      - run: npm run build:versions
        env:
          SITE_BASE: /qlang-learn/
          CACHE_DIR: .cache/versions
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
